<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Audiobook Library & Tracker</title>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1e2025;
      --accent: #2e78d2;
      --text: #f0f2f5;
      --subtext: #9ba1a6;
      --border: #2d3139;
      --borrowbox: #25a244;
      --audible: #f77f00;
      --wishlist: #9d4edd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; z-index: 100; }
    h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
    .search-box { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: #fff; font-size: 0.95rem; }
    .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; background: #16181d; border-bottom: 1px solid var(--border); }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; white-space: nowrap; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .stats-bar { padding: 10px 16px; font-size: 0.8rem; color: var(--subtext); display: flex; justify-content: space-between; }
    .list-container { padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
    .book-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .book-title { font-size: 1rem; font-weight: 600; color: #fff; line-height: 1.3; }
    .book-author { font-size: 0.86rem; color: var(--subtext); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
    .badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .badge-audible { background: rgba(247, 127, 0, 0.2); color: #fca311; }
    .badge-borrowbox { background: rgba(37, 162, 68, 0.2); color: #4ade80; }
    .badge-wishlist { background: rgba(157, 78, 221, 0.2); color: #c77dff; }
    .badge-status { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .badge-avail { background: rgba(46, 120, 210, 0.2); color: #60a5fa; }
    .series-tag { font-size: 0.8rem; color: #38bdf8; font-weight: 500; }
    .csv-upload-prompt { background: #232730; border: 1px dashed var(--accent); border-radius: 8px; padding: 16px; text-align: center; margin: 16px; }
    .upload-btn { background: var(--accent); color: white; padding: 8px 16px; border-radius: 6px; border: none; font-size: 0.88rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>Audiobook Tracker</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="Search title, author, series, narrator...">
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="setFilter('all')">All (799)</button>
    <button class="tab-btn" onclick="setFilter('ready')">Ready to Listen</button>
    <button class="tab-btn" onclick="setFilter('series')">Series View</button>
    <button class="tab-btn" onclick="setFilter('audible')">Audible Owned</button>
    <button class="tab-btn" onclick="setFilter('borrowbox')">BorrowBox</button>
    <button class="tab-btn" onclick="setFilter('wishlist')">Wishlists</button>
  </div>

  <div class="stats-bar">
    <span id="resultCount">Showing books</span>
    <span id="activeFilterLabel">Filter: All</span>
  </div>

  <div id="uploadPrompt" class="csv-upload-prompt" style="display:none;">
    <p>Select your <code>Master_Audiobook_Library.csv</code> file to load library data offline:</p>
    <input type="file" id="fileInput" accept=".csv" style="display:none;" onchange="handleFile(event)">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Load CSV</button>
  </div>

  <div class="list-container" id="bookList"></div>

  <script>
    let masterData = [];
    let currentFilter = 'all';

    // Auto-fetch if CSV is hosted alongside HTML, else show file prompt
    window.onload = function() {
      fetch('Master_Audiobook_Library.csv')
        .then(res => {
          if (!res.ok) throw new Error('Not hosted');
          return res.text();
        })
        .then(csv => parseCSV(csv))
        .catch(() => {
          document.getElementById('uploadPrompt').style.display = 'block';
        });
    };

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        parseCSV(ev.target.result);
        document.getElementById('uploadPrompt').style.display = 'none';
      };
      reader.readAsText(file);
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length < 2) return;
      const headers = lines[0].split(',').map(h => h.trim());
      
      // Basic CSV Parser handling quotes
      masterData = lines.slice(1).map(line => {
        const row = [];
        let inQuotes = false;
        let token = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' && (i === 0 || line[i-1] !== '\\')) {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(token.trim());
            token = '';
          } else {
            token += char;
          }
        }
        row.push(token.trim());

        let obj = {};
        headers.forEach((h, idx) => { obj[h] = row[idx] ? row[idx].replace(/^"|"\$/g, '') : ''; });
        return obj;
      });

      renderBooks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderBooks();
    }

    document.getElementById('searchInput').addEventListener('input', renderBooks);

    function renderBooks() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('bookList');
      container.innerHTML = '';

      let filtered = masterData.filter(b => {
        const matchesSearch = (b.Title || '').toLowerCase().includes(search) ||
                              (b.Author || '').toLowerCase().includes(search) ||
                              (b.Series || '').toLowerCase().includes(search) ||
                              (b.Narrator || '').toLowerCase().includes(search);
        if (!matchesSearch) return false;

        if (currentFilter === 'ready') {
          return b.Status === 'Unread / Owned' || b.Status === 'Available to Borrow' || b.Status.includes('In Progress');
        } else if (currentFilter === 'audible') {
          return b.Platform === 'Audible';
        } else if (currentFilter === 'borrowbox') {
          return b.Platform.includes('BorrowBox');
        } else if (currentFilter === 'wishlist') {
          return b.Platform.includes('Wishlist') || b.Status === 'On Reserve';
        } else if (currentFilter === 'series') {
          return (b.Series && b.Series.trim() !== '');
        }
        return true;
      });

      if (currentFilter === 'series') {
        filtered.sort((a, b) => (a.Series || '').localeCompare(b.Series || '') || (parseFloat(a.Book_Number) || 0) - (parseFloat(b.Book_Number) || 0));
      }

      document.getElementById('resultCount').textContent = `${filtered.length} books found`;
      document.getElementById('activeFilterLabel').textContent = `Filter: ${currentFilter.toUpperCase()}`;

      filtered.forEach(b => {
        const card = document.createElement('div');
        card.className = 'book-card';

        let platformBadgeClass = 'badge-audible';
        if (b.Platform.includes('BorrowBox')) platformBadgeClass = 'badge-borrowbox';
        if (b.Platform.includes('Wishlist')) platformBadgeClass = 'badge-wishlist';

        card.innerHTML = `
          <div class="book-title">${b.Title}</div>
          <div class="book-author">${b.Author} ${b.Narrator ? '• Narrated by ' + b.Narrator : ''}</div>
          ${b.Series ? `<div class="series-tag">${b.Series}${b.Book_Number ? '#' + b.Book_Number : ''}</div>` : ''}
          <div class="badge-row">
            <span class="badge ${platformBadgeClass}">${b.Platform}</span>
            <span class="badge badge-status">${b.Status}</span>
            ${b.Availability_Date ? `<span class="badge badge-avail">\${b.Availability_Date}</span>` : ''}
            ${b.Duration ? `<span class="badge badge-status">\${b.Duration}</span>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
